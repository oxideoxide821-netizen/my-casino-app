<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f0ff">
<title>Подик Тапалка</title>
<style>
  :root {
    --pink: #ef476f; --orange: #f78c6b; --green: #06d6a0;
    --ink: #1d2233; --muted: #6b7186;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background:
      radial-gradient(120% 60% at 20% 0%, #ffe9f0 0%, transparent 55%),
      radial-gradient(120% 60% at 90% 20%, #e7f7f0 0%, transparent 55%),
      linear-gradient(170deg, #faf7ff 0%, #eef1f9 100%);
    height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 18px max(16px, env(safe-area-inset-bottom));
    color: var(--ink); user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }

  /* ===== Шапка ===== */
  .top { text-align:center; flex-shrink:0; }
  .level-pill {
    display:inline-flex; align-items:center; gap:8px;
    background:#ffffffcc; backdrop-filter: blur(8px);
    border:1px solid #ffffff;
    padding:7px 16px; border-radius:999px;
    font-size:14px; font-weight:700; color:var(--muted);
    box-shadow:0 4px 14px rgba(29,34,51,.07);
  }
  .level-pill b {
    background:linear-gradient(90deg, var(--pink), var(--orange));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .puffs {
    font-size:56px; font-weight:800; letter-spacing:-2px; margin:10px 0 4px;
    font-variant-numeric:tabular-nums; line-height:1;
    transition:transform .1s;
  }
  .puffs.bump { transform:scale(1.12); }
  .puffs small { font-size:22px; font-weight:700; color:var(--muted); letter-spacing:0; }
  .per-tap {
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600; color:var(--muted);
    background:#ffffff90; padding:5px 14px; border-radius:999px;
  }

  /* ===== Карточка вейпа ===== */
  .vape-area { flex:1; min-height:0; width:100%; display:flex; align-items:center; justify-content:center; }
  .vape-card {
    position:relative;
    height:100%; max-height:350px; aspect-ratio:1/1; max-width:80vw;
    background:linear-gradient(160deg, #ffffff, #f6f8fd);
    border-radius:32px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; overflow:hidden;
    box-shadow:
      0 20px 44px rgba(29,34,51,.13),
      inset 0 0 0 1px #ffffff;
    transition:transform .08s;
  }
  .vape-card:active { transform:scale(.955); }
  .vape-card::before {
    content:''; position:absolute; inset:0;
    background:radial-gradient(70% 55% at 50% 18%, #ffffff 0%, transparent 70%);
    pointer-events:none;
  }
  .vape-img {
    max-width:82%; max-height:82%; object-fit:contain;
    mix-blend-mode:multiply;
    filter:drop-shadow(0 14px 18px rgba(29,34,51,.18));
    pointer-events:none;
    animation:appear .35s ease;
  }
  @keyframes appear { from { opacity:0; transform:translateY(10px) scale(.94); } to { opacity:1; } }
  .vape-emoji { font-size:110px; line-height:1; pointer-events:none; }

  /* ===== Прогресс с точками ===== */
  .progress-wrap { width:min(310px, 76vw); flex-shrink:0; margin:14px 0 14px; }
  .progress {
    height:9px; background:#1d223312; border-radius:999px; overflow:hidden;
  }
  .progress div {
    height:100%; border-radius:999px;
    background:linear-gradient(90deg, var(--green), var(--pink));
    transition:width .35s ease;
  }
  .progress-label {
    display:flex; justify-content:space-between;
    font-size:11px; font-weight:600; color:var(--muted); margin-top:5px;
  }

  /* ===== Кнопка ===== */
  .shop-btn {
    flex-shrink:0; width:min(310px, 80vw);
    padding:16px; border:none; border-radius:18px; cursor:pointer;
    background:linear-gradient(92deg, var(--pink), var(--orange));
    color:#fff; font-size:16px; font-weight:700; font-family:inherit;
    box-shadow:0 10px 26px rgba(239,71,111,.4), inset 0 1px 0 #ffffff55;
    transition:transform .08s, box-shadow .2s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .shop-btn:active { transform:scale(.96); box-shadow:0 5px 14px rgba(239,71,111,.35); }

  /* ===== Бонус ===== */
  .bonus {
    position:fixed; font-size:26px; font-weight:800; color:var(--pink);
    pointer-events:none; z-index:50; animation:float 1s forwards;
    text-shadow:0 2px 8px #ffffff;
  }
  @keyframes float { to { transform:translateY(-90px); opacity:0; } }

  /* ===== Шторка магазина ===== */
  .backdrop {
    position:fixed; inset:0; background:rgba(20,16,35,.45);
    backdrop-filter:blur(3px);
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:20;
  }
  .backdrop.open { opacity:1; pointer-events:auto; }
  .sheet {
    position:fixed; left:0; right:0; bottom:0; max-height:76vh; z-index:21;
    background:#fff; border-radius:26px 26px 0 0;
    transform:translateY(105%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column;
    box-shadow:0 -12px 44px rgba(20,16,35,.25);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .sheet.open { transform:translateY(0); }
  .sheet-handle { width:44px; height:5px; border-radius:3px; background:#1d223322; margin:10px auto 2px; flex-shrink:0; }
  .sheet-head {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px 12px; flex-shrink:0;
  }
  .sheet-title { font-size:19px; font-weight:800; }
  .sheet-puffs {
    font-size:14px; font-weight:700; color:var(--pink);
    background:#ef476f12; padding:5px 12px; border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .shop-list { overflow-y:auto; padding:0 14px; flex:1; }
  .shop-item {
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:18px; margin-bottom:8px;
    background:#f4f6fb;
    transition:transform .1s;
  }
  .shop-item.current {
    background:linear-gradient(90deg, #ef476f14, #f78c6b14);
    box-shadow:inset 0 0 0 2px #ef476f45;
  }
  .shop-item.locked { opacity:.5; }
  .shop-thumb {
    width:52px; height:52px; border-radius:14px;
    background:#fff; display:flex; align-items:center; justify-content:center;
    overflow:hidden; flex-shrink:0; font-size:28px;
    box-shadow:0 2px 8px rgba(29,34,51,.06);
  }
  .shop-thumb img { width:86%; height:86%; object-fit:contain; mix-blend-mode:multiply; }
  .shop-info { flex:1; min-width:0; }
  .shop-name { font-weight:700; font-size:15px; }
  .shop-sub { font-size:13px; color:var(--muted); }
  .buy-btn {
    border:none; border-radius:12px; padding:10px 14px; cursor:pointer;
    background:linear-gradient(92deg, var(--pink), var(--orange));
    color:#fff; font-weight:700; font-size:13px; font-family:inherit;
    white-space:nowrap; flex-shrink:0;
    box-shadow:0 4px 12px rgba(239,71,111,.3);
  }
  .buy-btn:disabled { opacity:.35; box-shadow:none; }
  .badge { font-size:13px; font-weight:700; color:#0aa87e; white-space:nowrap; flex-shrink:0; }
  .badge.lock { color:#9aa0b4; }
  .sheet-footer { padding:10px 14px 14px; border-top:1px solid #1d223310; flex-shrink:0; }
  .reset-btn {
    width:100%; padding:12px; border:none; border-radius:12px; cursor:pointer;
    background:#1d22330d; color:var(--ink); font-weight:700; font-family:inherit;
  }
</style>
</head>
<body>

<div class="top">
  <div class="level-pill">LEVEL <b id="levelNum">1</b> · <b id="levelName">Elf Bar</b></div>
  <div class="puffs"><span id="puffs">0</span> <small>💨</small></div>
  <div class="per-tap">+<span id="perTap">1</span> за тап</div>
</div>

<div class="vape-area">
  <div class="vape-card" id="vapeBox"></div>
</div>

<div class="progress-wrap">
  <div class="progress"><div id="bar" style="width:0%"></div></div>
  <div class="progress-label"><span id="progFrom">Lv.1</span><span id="progTo">Lv.11 👑</span></div>
</div>

<button class="shop-btn" id="shopBtn">🛒&nbsp; Магазин подиков</button>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div class="sheet-title">Магазин подиков</div>
    <div class="sheet-puffs" id="sheetPuffs">0 💨</div>
  </div>
  <div class="shop-list" id="shopList"></div>
  <div class="sheet-footer">
    <button class="reset-btn" id="reset">🔄 Сброс прогресса</button>
  </div>
</div>

<script>
const LEVELS = [
  { name: 'Elf Bar', full: 'Одноразка Elf Bar', emoji: '💨',
    img: 'https://kimi-web-img.kimi.ai/img/www.vapour.com/2cbdfa4c24d4fa33a1c6c06b525c9fc4ed36cdbc.png',
    income: 1,    cost: 100 },
  { name: 'Zero S', full: 'Vaporesso Zero S', emoji: '🟢',
    img: 'https://kimi-web-img.kimi.ai/img/store.vaporesso.com/4951828f705209f96abb0da357d02fb1472b8db7.png',
    income: 2,    cost: 400 },
  { name: 'Charon Baby', full: 'Charon Baby', emoji: '🟦',
    img: 'https://kimi-web-img.kimi.ai/img/d2j6dbq0eux0bg.cloudfront.net/99d6e5821a3bfa49162a0a201ad1b991e1690cba.jpg',
    income: 5,    cost: 1200 },
  { name: 'Caliburn G4', full: 'Caliburn G4 Mini', emoji: '🔷',
    img: 'https://kimi-web-img.kimi.ai/img/www.supavapes.com/7941e49acf9cc0bbcb081ad1fd5fce7070dcc4cf.png',
    income: 10,   cost: 3500 },
  { name: 'SMOK Novo', full: 'SMOK Novo', emoji: '⬛',
    img: 'https://kimi-web-img.kimi.ai/img/www.ecigwizard.com/ff60848c2ae9a9597002cd51e1bc727c6594a5b4.png',
    income: 20,   cost: 9000 },
  { name: 'Wenax Q', full: 'Geekvape Wenax Q', emoji: '🟧',
    img: 'https://kimi-web-img.kimi.ai/img/www.vaporshopdirect.com/300934981c1cf680ac381c1d16565342188d3a8d.png',
    income: 40,   cost: 20000 },
  { name: 'Jellybox V3', full: 'Jellybox V3', emoji: '🟨',
    img: 'https://kimi-web-img.kimi.ai/img/cdn.salla.sa/f21ec17cf33d03dd47f6c25e238e580f0ba72466.jpg',
    income: 80,   cost: 45000 },
  { name: 'Argus P1', full: 'Voopoo Argus P1', emoji: '🟥',
    img: 'https://kimi-web-img.kimi.ai/img/vape360.co.uk/d226b2fb6738ed04bf4f1c1b65fb3fdaa9612adf.png',
    income: 160,  cost: 100000 },
  { name: 'XROS 5', full: 'Vaporesso XROS 5', emoji: '⬜',
    img: 'https://kimi-web-img.kimi.ai/img/media.vaping360.com/d131ea91dee349629e81c4dcd127381b384336ea.webp',
    income: 320,  cost: 220000 },
  { name: 'Pasito 2', full: 'Pasito 2', emoji: '🟪',
    img: 'https://kimi-web-img.kimi.ai/img/www.sourcemore.com/bf748325ae845d42a2ee95aba4cc07bc2c7401bc.jpg',
    income: 650,  cost: 500000 },
  { name: 'Pasito 3', full: 'Pasito 3', emoji: '👑',
    img: 'https://kimi-web-img.kimi.ai/img/cdn.shopify.com/d3889e59279267e22282273db539bd23215215b1.webp',
    income: 1500, cost: null }
];

let puffs = +(localStorage.puffs || 0);
let level = +(localStorage.level || 0);

const $ = id => document.getElementById(id);
const vapeBox = $('vapeBox'), sheet = $('sheet'), backdrop = $('backdrop'), shopList = $('shopList');

function save() { localStorage.puffs = puffs; localStorage.level = level; }

function render() {
  const L = LEVELS[level];
  $('levelNum').textContent = level + 1;
  $('levelName').textContent = L.name;
  $('puffs').textContent = puffs.toLocaleString('ru-RU');
  $('perTap').textContent = L.income;
  $('bar').style.width = (level / (LEVELS.length - 1) * 100) + '%';
  $('progFrom').textContent = 'Lv.' + (level + 1);
  $('sheetPuffs').textContent = puffs.toLocaleString('ru-RU') + ' 💨';

  vapeBox.innerHTML = '';
  const img = document.createElement('img');
  img.className = 'vape-img';
  img.src = L.img;
  img.onerror = () => { vapeBox.innerHTML = '<div class="vape-emoji">' + L.emoji + '</div>'; };
  vapeBox.appendChild(img);

  renderShop();
  save();
}

function renderShop() {
  $('sheetPuffs').textContent = puffs.toLocaleString('ru-RU') + ' 💨';
  shopList.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const isCurrent = i === level, isNext = i === level + 1, isMax = L.cost === null;
    const item = document.createElement('div');
    item.className = 'shop-item' + (isCurrent ? ' current' : '') + (!isCurrent && !isNext ? ' locked' : '');

    const thumb = document.createElement('div');
    thumb.className = 'shop-thumb';
    const timg = document.createElement('img');
    timg.src = L.img;
    timg.onerror = () => { thumb.textContent = L.emoji; };
    thumb.appendChild(timg);

    const info = document.createElement('div');
    info.className = 'shop-info';
    info.innerHTML = '<div class="shop-name">' + L.full + '</div>' +
      '<div class="shop-sub">+' + L.income + ' за тап' + (isMax ? ' · максимум' : ' · ' + L.cost.toLocaleString('ru-RU') + '💨') + '</div>';

    item.appendChild(thumb);
    item.appendChild(info);

    if (isCurrent) {
      const b = document.createElement('div');
      b.className = 'badge'; b.textContent = '✓ Твой';
      item.appendChild(b);
    } else if (isMax) {
      const b = document.createElement('div');
      b.className = 'badge'; b.textContent = '👑';
      item.appendChild(b);
    } else if (isNext) {
      const btn = document.createElement('button');
      btn.className = 'buy-btn';
      btn.textContent = 'Купить';
      btn.disabled = puffs < L.cost;
      btn.addEventListener('click', () => {
        if (puffs >= L.cost) { puffs -= L.cost; level = i; render(); }
      });
      item.appendChild(btn);
    } else {
      const b = document.createElement('div');
      b.className = 'badge lock'; b.textContent = '🔒';
      item.appendChild(b);
    }
    shopList.appendChild(item);
  });
}

vapeBox.addEventListener('pointerdown', e => {
  const L = LEVELS[level];
  puffs += L.income;
  $('puffs').textContent = puffs.toLocaleString('ru-RU');
  $('puffs').parentElement.classList.add('bump');
  setTimeout(() => $('puffs').parentElement.classList.remove('bump'), 100);

  const b = document.createElement('div');
  b.className = 'bonus';
  b.textContent = '+' + L.income + '💨';
  b.style.left = e.clientX + 'px';
  b.style.top = e.clientY + 'px';
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 1000);

  renderShop();
  save();
});

function toggleShop(open) {
  sheet.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
$('shopBtn').addEventListener('click', () => toggleShop(true));
backdrop.addEventListener('click', () => toggleShop(false));

$('reset').addEventListener('click', () => {
  if (confirm('Точно сбросить весь прогресс?')) {
    puffs = 0; level = 0; render();
  }
});

render();
</script>
</body>
</html>
